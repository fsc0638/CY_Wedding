<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="robots" content="noindex, nofollow" />
<title>喜餅兌換券核銷 — 工作人員</title>
<style>
  :root {
    --bg: #f4f3ea; --card: #ffffff; --ink: #2d2b25; --soft: #6b6a5f;
    --line: #e0ddd0; --green: #3a4a32; --green-d: #2e3a2c;
    --red: #c0392b; --gold: #b08d3f;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    font-family: -apple-system, "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", system-ui, sans-serif;
    background: var(--bg); color: var(--ink);
    min-height: 100vh; padding: 1.2rem; line-height: 1.6;
    -webkit-text-size-adjust: 100%;
  }
  .wrap { max-width: 440px; margin: 0 auto; }
  header.top {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 1.2rem; gap: 0.6rem;
  }
  header.top h1 { font-size: 1.05rem; margin: 0; letter-spacing: 0.04em; }
  .card {
    background: var(--card); border: 1px solid var(--line);
    border-radius: 16px; padding: 1.5rem 1.3rem;
    box-shadow: 0 10px 28px rgba(45, 43, 37, 0.08);
  }
  label { display: block; font-size: 0.82rem; color: var(--soft); margin: 0 0 0.35rem; }
  input {
    width: 100%; padding: 0.7rem 0.85rem; font-size: 1rem;
    border: 1px solid var(--line); border-radius: 10px; background: #fbfbf6;
    color: var(--ink); margin-bottom: 0.9rem;
  }
  input:focus { outline: 2px solid var(--green); outline-offset: 1px; }
  button {
    font: inherit; cursor: pointer; border: none; border-radius: 10px;
    padding: 0.78rem 1rem; font-size: 0.98rem; letter-spacing: 0.04em;
    transition: filter 0.2s ease, opacity 0.2s ease;
  }
  button:disabled { opacity: 0.5; cursor: default; }
  button:active { filter: brightness(0.94); }
  .btn-primary { background: var(--green); color: #fff; width: 100%; }
  .btn-redeem { background: var(--green); color: #fff; width: 100%; font-weight: 600; }
  .btn-cancel { background: transparent; color: var(--red); border: 1px solid var(--red); width: 100%; }
  .btn-ghost {
    background: transparent; color: var(--soft); border: 1px solid var(--line);
    padding: 0.4rem 0.8rem; font-size: 0.8rem;
  }
  .msg { font-size: 0.86rem; margin: 0.4rem 0 0; min-height: 1.2em; }
  .msg.err { color: var(--red); }
  .msg.ok { color: var(--green); }
  [hidden] { display: none !important; }

  /* 賓客資訊 */
  .who { text-align: center; margin-bottom: 1.2rem; }
  .who .name { font-size: 1.6rem; font-weight: 700; letter-spacing: 0.06em; }
  .who .code {
    font-family: ui-monospace, "SF Mono", Menlo, monospace;
    font-size: 1.05rem; color: var(--gold); letter-spacing: 0.18em; margin-top: 0.3rem;
  }
  .status-pill {
    display: inline-flex; align-items: center; gap: 0.4rem;
    margin: 1rem auto 0; padding: 0.45rem 1.1rem; border-radius: 999px;
    font-weight: 600; font-size: 0.95rem;
  }
  .status-pill.unredeemed { background: #eef1ea; color: var(--green-d); }
  .status-pill.redeemed { background: rgba(192, 57, 43, 0.1); color: var(--red); }
  .status-pill .dot { width: 9px; height: 9px; border-radius: 50%; background: currentColor; }
  .redeemed-at { font-size: 0.78rem; color: var(--soft); text-align: center; margin: 0.5rem 0 0; }
  .actions { margin-top: 1.4rem; display: flex; flex-direction: column; gap: 0.7rem; }
  .foot { text-align: center; color: var(--soft); font-size: 0.72rem; margin-top: 1.6rem; }
  .loading { text-align: center; color: var(--soft); padding: 2rem 0; }

  /* 女方親友名單看板 */
  .roster { margin-top: 1.1rem; }
  .roster-head {
    display: flex; align-items: baseline; justify-content: space-between;
    margin-bottom: 0.9rem; gap: 0.6rem;
  }
  .roster-head h2 { font-size: 1rem; margin: 0; letter-spacing: 0.04em; }
  .roster-count { font-size: 0.85rem; color: var(--soft); }
  .roster-count b { color: var(--green); font-size: 1.05rem; }
  .roster-search {
    width: 100%; padding: 0.55rem 0.75rem; font-size: 0.92rem; margin: 0 0 0.7rem;
  }
  .roster-list { list-style: none; margin: 0; padding: 0; }
  .roster-list li {
    display: flex; align-items: center; gap: 0.6rem;
    padding: 0.6rem 0.2rem; border-bottom: 1px solid var(--line);
  }
  .roster-list li:last-child { border-bottom: none; }
  .r-state {
    flex: 0 0 auto; width: 10px; height: 10px; border-radius: 50%;
    background: #cfd3c6;
  }
  .roster-list li.is-redeemed .r-state { background: var(--red); }
  .r-main { flex: 1 1 auto; min-width: 0; }
  .r-name { font-weight: 600; font-size: 0.98rem; }
  .roster-list li.is-redeemed .r-name { color: var(--soft); }
  .r-code {
    font-family: ui-monospace, "SF Mono", Menlo, monospace;
    font-size: 0.78rem; color: var(--gold); letter-spacing: 0.1em;
  }
  .r-tag { flex: 0 0 auto; text-align: right; font-size: 0.74rem; }
  .r-tag .lbl { font-weight: 600; }
  .roster-list li.is-redeemed .r-tag .lbl { color: var(--red); }
  .roster-list li:not(.is-redeemed) .r-tag .lbl { color: var(--green); }
  .r-tag .at { color: var(--soft); display: block; }
  .roster-empty { text-align: center; color: var(--soft); padding: 1.2rem 0; }
  .roster-export { width: 100%; margin-top: 1rem; }

  /* 喜餅樣式 / 滿月禮 徽章 */
  .badge {
    display: inline-flex; align-items: center; gap: 0.25rem;
    padding: 0.12rem 0.5rem; border-radius: 999px;
    font-size: 0.74rem; font-weight: 600; line-height: 1.5; white-space: nowrap;
  }
  .badge-cn   { background: #eef1ea; color: var(--green-d); }
  .badge-west { background: #f3e9d2; color: #8a6d1f; }
  .badge-moon { background: rgba(176, 141, 63, 0.16); color: var(--gold); }

  /* 核銷面板：大徽章 */
  .v-badges { display: flex; justify-content: center; flex-wrap: wrap; gap: 0.5rem; margin-top: 0.7rem; }
  .v-badges .badge { font-size: 0.92rem; padding: 0.3rem 0.85rem; }
  .v-note {
    font-size: 0.85rem; color: var(--soft); text-align: center;
    margin: 0.7rem 0 0; padding: 0.5rem 0.7rem; background: #faf8f0; border-radius: 8px;
  }

  /* 名單統計與篩選 */
  .roster-stats { font-size: 0.82rem; color: var(--soft); margin-bottom: 0.7rem; }
  .roster-stats b { color: var(--green); font-size: 1rem; }
  .roster-stats .sep { color: var(--line); margin: 0 0.45rem; }
  .roster-filters { display: flex; flex-wrap: wrap; gap: 0.4rem; margin-bottom: 0.7rem; }
  .rf {
    background: transparent; color: var(--soft); border: 1px solid var(--line);
    padding: 0.32rem 0.7rem; font-size: 0.8rem; border-radius: 999px;
  }
  .rf.active { background: var(--green); color: #fff; border-color: var(--green); }
  .r-gifts { display: flex; gap: 0.3rem; margin-top: 0.3rem; }
  .r-gift { transform: scale(0.92); transform-origin: left center; }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <h1>喜餅兌換券 · 核銷</h1>
    <button class="btn-ghost" id="logoutBtn" hidden>登出</button>
  </header>

  <!-- 1) 登入（工作人員一次登入即記住）-->
  <section class="card" id="loginCard" hidden>
    <label for="email">工作人員帳號</label>
    <input type="email" id="email" autocomplete="username" inputmode="email" placeholder="email@example.com" />
    <label for="password">密碼</label>
    <input type="password" id="password" autocomplete="current-password" placeholder="密碼" />
    <button class="btn-primary" id="loginBtn">登入</button>
    <p class="msg err" id="loginMsg"></p>
  </section>

  <!-- 2) 核銷面板 -->
  <section class="card" id="panel" hidden>
    <div class="loading" id="panelLoading">讀取中⋯</div>

    <div id="voucherInfo" hidden>
      <div class="who">
        <div class="name" id="vName">—</div>
        <div class="code" id="vCode">—</div>
        <div class="v-badges" id="vBadges"></div>
        <div class="status-pill" id="vPill"><span class="dot"></span><span id="vPillText">—</span></div>
        <p class="redeemed-at" id="vAt" hidden></p>
        <p class="v-note" id="vNote" hidden></p>
      </div>
      <div class="actions">
        <button class="btn-redeem" id="redeemBtn" hidden>確認核銷</button>
        <button class="btn-cancel" id="cancelBtn" hidden>取消核銷</button>
      </div>
      <p class="msg" id="actionMsg"></p>
    </div>

    <p class="msg err" id="panelErr" hidden></p>
  </section>

  <!-- 3) 女方親友名單即時看板 -->
  <section class="card roster" id="rosterCard" hidden>
    <div class="roster-head">
      <h2>女方親友名單</h2>
    </div>
    <div class="roster-stats" id="rosterStats">讀取中⋯</div>
    <div class="roster-filters" id="rosterFilters">
      <button class="rf active" data-f="all">全部</button>
      <button class="rf" data-f="unredeemed">未領</button>
      <button class="rf" data-f="redeemed">已領</button>
      <button class="rf" data-f="chinese">中式</button>
      <button class="rf" data-f="western">西式</button>
      <button class="rf" data-f="fullmoon">滿月禮</button>
    </div>
    <input type="text" class="roster-search" id="rosterSearch" placeholder="搜尋姓名或券號⋯" autocomplete="off" />
    <ul class="roster-list" id="rosterList"></ul>
    <button class="btn-ghost roster-export" id="exportBtn">匯出 CSV</button>
    <p class="roster-empty" id="rosterEmpty" hidden>目前沒有名單資料。</p>
  </section>

  <p class="foot">CY Wedding · 內部核銷用</p>
</div>

<script type="module">
  import { db, auth } from "./firebase.js";
  import {
    onAuthStateChanged, signInWithEmailAndPassword, signOut
  } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js";
  import {
    doc, collection, onSnapshot, updateDoc, serverTimestamp
  } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore.js";

  const $ = (id) => document.getElementById(id);
  const loginCard = $("loginCard"), panel = $("panel"), logoutBtn = $("logoutBtn");
  const panelLoading = $("panelLoading"), voucherInfo = $("voucherInfo"), panelErr = $("panelErr");
  const rosterCard = $("rosterCard");

  // 取 ?h=<姓名雜湊>
  let hash = null;
  try { hash = new URLSearchParams(location.search).get("h"); } catch (e) {}
  if (hash) hash = hash.trim().toLowerCase();
  const validHash = !!hash && /^[0-9a-f]{64}$/.test(hash);

  // ---- 登入 ----
  $("loginBtn").addEventListener("click", doLogin);
  $("password").addEventListener("keydown", (e) => { if (e.key === "Enter") doLogin(); });
  function doLogin() {
    const email = $("email").value.trim();
    const pw = $("password").value;
    const msg = $("loginMsg");
    msg.textContent = "";
    if (!email || !pw) { msg.textContent = "請輸入帳號與密碼"; return; }
    $("loginBtn").disabled = true;
    signInWithEmailAndPassword(auth, email, pw)
      .catch((err) => {
        const m = { "auth/invalid-credential": "帳號或密碼錯誤", "auth/invalid-email": "Email 格式錯誤",
                    "auth/too-many-requests": "嘗試次數過多，請稍後再試", "auth/network-request-failed": "網路連線失敗" };
        msg.textContent = m[err && err.code] || ("登入失敗：" + (err && err.code || err));
      })
      .finally(() => { $("loginBtn").disabled = false; });
  }
  logoutBtn.addEventListener("click", () => signOut(auth));

  // ---- 登入狀態切換 ----
  let unsub = null, rosterUnsub = null;
  onAuthStateChanged(auth, (user) => {
    if (user) {
      loginCard.hidden = true;
      logoutBtn.hidden = false;
      panel.hidden = !validHash;     // 沒帶券代碼時只顯示名單看板
      rosterCard.hidden = false;
      startWatch();
      startRosterWatch();
    } else {
      if (unsub) { unsub(); unsub = null; }
      if (rosterUnsub) { rosterUnsub(); rosterUnsub = null; }
      panel.hidden = true;
      rosterCard.hidden = true;
      logoutBtn.hidden = true;
      loginCard.hidden = false;
      $("password").value = "";
    }
  });

  // ---- 監聽該券即時狀態 ----
  function startWatch() {
    if (!validHash) {
      panelLoading.hidden = true;
      panelErr.hidden = false;
      panelErr.textContent = "QR 連結無效或缺少券代碼，請重新掃描賓客的 QR。";
      return;
    }
    if (unsub) return; // 已在監聽
    unsub = onSnapshot(doc(db, "vouchers", hash), (snap) => {
      panelLoading.hidden = true;
      if (!snap.exists()) {
        voucherInfo.hidden = true;
        panelErr.hidden = false;
        panelErr.textContent = "查無此券（可能不是女方賓客名單，或尚未匯入）。";
        return;
      }
      panelErr.hidden = true;
      render(snap.data());
    }, (err) => {
      panelLoading.hidden = true;
      panelErr.hidden = false;
      panelErr.textContent = "讀取失敗：" + (err && err.code || err);
    });
  }

  function fmt(ts) {
    try {
      const d = ts && ts.toDate ? ts.toDate() : (ts ? new Date(ts) : null);
      if (!d) return "";
      const p = (n) => (n < 10 ? "0" : "") + n;
      return d.getFullYear() + "/" + p(d.getMonth() + 1) + "/" + p(d.getDate()) +
             " " + p(d.getHours()) + ":" + p(d.getMinutes());
    } catch (e) { return ""; }
  }

  // 喜餅樣式 / 滿月禮 判定
  const isWestern = (d) => (d.giftType || "chinese") === "western";
  const giftLabel = (d) => isWestern(d) ? "西式喜餅" : "中式喜餅";
  const hasFullMoon = (d) => /滿月/.test(d.note || "");

  function render(d) {
    voucherInfo.hidden = false;
    $("vName").textContent = d.name || "（未命名）";
    $("vCode").textContent = d.code ? ("NO. " + d.code) : "";

    // 喜餅樣式 + 滿月禮 大徽章（避免發錯盒）
    const badges = $("vBadges");
    badges.innerHTML =
      '<span class="badge ' + (isWestern(d) ? "badge-west" : "badge-cn") + '">' + giftLabel(d) + "</span>" +
      (hasFullMoon(d) ? '<span class="badge badge-moon">＋滿月禮</span>' : "");

    const pill = $("vPill"), redeemed = !!d.redeemed;
    pill.className = "status-pill " + (redeemed ? "redeemed" : "unredeemed");
    $("vPillText").textContent = redeemed ? "已領取" : "尚未領取";
    const at = $("vAt"), atStr = redeemed ? fmt(d.redeemedAt) : "";
    at.hidden = !atStr;
    at.textContent = atStr ? ("核銷時間：" + atStr) : "";

    const note = $("vNote"), noteStr = (d.note || "").trim();
    note.hidden = !noteStr;
    note.textContent = noteStr ? ("備註：" + noteStr) : "";

    $("redeemBtn").hidden = redeemed;
    $("cancelBtn").hidden = !redeemed;
    $("actionMsg").textContent = "";
    $("actionMsg").className = "msg";
  }

  // ---- 女方親友名單即時看板 ----
  let rosterDocs = [];
  let rosterFilter = "all";
  const rosterList = $("rosterList"), rosterStats = $("rosterStats");
  const rosterEmpty = $("rosterEmpty"), rosterSearch = $("rosterSearch");

  function startRosterWatch() {
    if (rosterUnsub) return;
    rosterUnsub = onSnapshot(collection(db, "vouchers"), (snap) => {
      rosterDocs = [];
      snap.forEach((d) => {
        const v = d.data() || {};
        if (v.side && v.side !== "bride") return;   // 只列女方賓客
        rosterDocs.push({
          id: d.id, name: v.name || "（未命名）", code: v.code || "",
          western: (v.giftType || "chinese") === "western",
          fullMoon: /滿月/.test(v.note || ""), note: (v.note || "").trim(),
          redeemed: !!v.redeemed, redeemedAt: v.redeemedAt || null
        });
      });
      // 未領取在前、已領取在後；同組依姓名排序
      rosterDocs.sort((a, b) =>
        (a.redeemed - b.redeemed) || a.name.localeCompare(b.name, "zh-Hant"));
      renderRoster();
    }, (err) => {
      rosterList.innerHTML = "";
      rosterStats.textContent = "名單讀取失敗：" + (err && err.code || err);
      rosterEmpty.hidden = true;
    });
  }

  function matchFilter(r) {
    switch (rosterFilter) {
      case "unredeemed": return !r.redeemed;
      case "redeemed":   return r.redeemed;
      case "chinese":    return !r.western;
      case "western":    return r.western;
      case "fullmoon":   return r.fullMoon;
      default:           return true;
    }
  }

  function renderRoster() {
    const total = rosterDocs.length;
    const done = rosterDocs.filter((r) => r.redeemed).length;
    const west = rosterDocs.filter((r) => r.western).length;
    const cn = total - west;
    const moon = rosterDocs.filter((r) => r.fullMoon).length;
    rosterStats.innerHTML =
      "已領取 <b>" + done + "</b> / " + total +
      '<span class="sep">|</span>中式 ' + cn + " · 西式 " + west +
      (moon ? '<span class="sep">|</span>滿月禮 ' + moon : "");

    const kw = (rosterSearch.value || "").trim().toLowerCase();
    const shown = rosterDocs.filter((r) =>
      matchFilter(r) &&
      (!kw || r.name.toLowerCase().includes(kw) || String(r.code).toLowerCase().includes(kw)));

    rosterList.innerHTML = "";
    if (!shown.length) {
      rosterEmpty.hidden = false;
      rosterEmpty.textContent = total ? "查無符合的賓客。" : "目前沒有名單資料。";
      return;
    }
    rosterEmpty.hidden = true;
    const frag = document.createDocumentFragment();
    for (const r of shown) {
      const li = document.createElement("li");
      if (r.redeemed) li.className = "is-redeemed";
      const atStr = r.redeemed ? fmt(r.redeemedAt) : "";
      const giftBadge = '<span class="badge ' + (r.western ? "badge-west" : "badge-cn") +
        ' r-gift">' + (r.western ? "西式" : "中式") + "</span>" +
        (r.fullMoon ? '<span class="badge badge-moon r-gift">滿月禮</span>' : "");
      li.innerHTML =
        '<span class="r-state"></span>' +
        '<span class="r-main"><span class="r-name"></span>' +
        (r.code ? ' <span class="r-code">NO. ' + escapeHtml(r.code) + "</span>" : "") +
        '<span class="r-gifts">' + giftBadge + "</span>" +
        '</span>' +
        '<span class="r-tag"><span class="lbl">' + (r.redeemed ? "已領取" : "未領取") + "</span>" +
        (atStr ? '<span class="at">' + escapeHtml(atStr) + "</span>" : "") + "</span>";
      li.querySelector(".r-name").textContent = r.name;
      frag.appendChild(li);
    }
    rosterList.appendChild(frag);
  }

  // 篩選鈕
  $("rosterFilters").addEventListener("click", (e) => {
    const btn = e.target.closest(".rf");
    if (!btn) return;
    rosterFilter = btn.dataset.f || "all";
    document.querySelectorAll("#rosterFilters .rf").forEach((b) =>
      b.classList.toggle("active", b === btn));
    renderRoster();
  });

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, (c) =>
      ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  }

  rosterSearch.addEventListener("input", renderRoster);

  // ---- 匯出 CSV（前端即時下載，含 BOM 讓 Excel 正確顯示中文）----
  function csvCell(v) {
    const s = v == null ? "" : String(v);
    return /[",\n\r]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
  }
  $("exportBtn").addEventListener("click", () => {
    if (!rosterDocs.length) { alert("目前沒有可匯出的名單資料。"); return; }
    const header = ["姓名", "喜餅兌換碼", "喜餅樣式", "滿月禮", "領取狀態", "核銷時間", "備註"];
    const lines = [header.map(csvCell).join(",")];
    // 依目前排序匯出（未領在前、已領在後）
    for (const r of rosterDocs) {
      lines.push([
        csvCell(r.name),
        csvCell(r.code),
        csvCell(r.western ? "西式" : "中式"),
        csvCell(r.fullMoon ? "滿月禮" : ""),
        csvCell(r.redeemed ? "已領取" : "未領取"),
        csvCell(r.redeemed ? fmt(r.redeemedAt) : ""),
        csvCell(r.note)
      ].join(","));
    }
    const done = rosterDocs.filter((r) => r.redeemed).length;
    const west = rosterDocs.filter((r) => r.western).length;
    const moon = rosterDocs.filter((r) => r.fullMoon).length;
    lines.push("");                                       // 空行後附統計
    lines.push(csvCell("統計") + "," +
      csvCell("已領取 " + done + " / 共 " + rosterDocs.length +
              "；中式 " + (rosterDocs.length - west) + " · 西式 " + west +
              "；滿月禮 " + moon));

    const csv = "﻿" + lines.join("\r\n");
    const blob = new Blob([csv], { type: "text/csv;charset=utf-8;" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    const now = new Date();
    const p = (n) => (n < 10 ? "0" : "") + n;
    a.href = url;
    a.download = "喜餅核銷名單_" + now.getFullYear() + p(now.getMonth() + 1) + p(now.getDate()) +
                 "_" + p(now.getHours()) + p(now.getMinutes()) + ".csv";
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
  });

  // ---- 核銷 / 取消 ----
  $("redeemBtn").addEventListener("click", () => setRedeemed(true));
  $("cancelBtn").addEventListener("click", () => {
    if (confirm("確定要『取消核銷』嗎？此券將回到尚未領取狀態。")) setRedeemed(false);
  });
  function setRedeemed(on) {
    const msg = $("actionMsg");
    $("redeemBtn").disabled = $("cancelBtn").disabled = true;
    updateDoc(doc(db, "vouchers", hash), {
      redeemed: on,
      redeemedAt: on ? serverTimestamp() : null
    }).then(() => {
      msg.className = "msg ok";
      msg.textContent = on ? "✓ 已核銷，賓客畫面將浮現「已領取」印章。" : "已取消核銷。";
    }).catch((err) => {
      msg.className = "msg err";
      msg.textContent = "操作失敗：" + (err && err.code || err);
    }).finally(() => {
      $("redeemBtn").disabled = $("cancelBtn").disabled = false;
    });
  }
</script>
</body>
</html>
